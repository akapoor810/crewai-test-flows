[project]
name = "writing_crew"
version = "0.1.0"
description = "writing_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.8.1"
]

[project.scripts]
writing_crew = "writing_crew.main:run"
run_crew = "writing_crew.main:run"
train = "writing_crew.main:train"
replay = "writing_crew.main:replay"
test = "writing_crew.main:test"
run_with_trigger = "writing_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
